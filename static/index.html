<!DOCTYPE html>
<html>
    <head>
        <title>Wordle</title>
        <style>
            body {
                max-width: 400px;
                margin: 0 auto;
                text-align: center;
            }            
            .tile {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 50px;
                height: 50px;
                border: 2px solid #888;
            }
            .row {
                display: grid;
                grid-template-columns: repeat(5, 50px);
                gap: 5px;
            }
            .key-row {
                display: flex;
                gap: 5px;
            }
            .key {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 30px;
                height: 30px;
                border: 2px solid #888;
            }
            #board {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                margin-top: 20px;
            }
            #keyboard {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                margin-top: 20px;
            }
            .green { background-color: #6aaa64; }
            .yellow { background-color: #c9b458; }
            .grey { background-color: #787c7e; }
        </style>
    </head>
    <body>
        <h1>Wordle</h1>
        <input id="guess" type="text" maxlength="5">
        <button id="submit">Guess</button>
        <button id="new">New Game</button>
        <div id="board"></div>
        <div id="keyboard"></div>
        <p id="output"></p>
        <script src="/static/script.js"></script>
    </body>
</html>
